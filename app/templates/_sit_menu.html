{# the ⋯ button of a разбор: opens its menu (rename, delete); app.js builds the menu and the dialogs #}
{% macro sit_more(s, cls) %}<button class="{{ cls }}" type="button" data-sit-menu="{{ s.id }}" data-title="{{ s.title }}"{% if s.plan and s.plan.sent_to_shtab_id %} data-shtab="1"{% endif %} aria-haspopup="menu" aria-expanded="false" aria-label="Действия: {{ s.title }}"><svg class="i-dots" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg></button>{% endmacro %}
